<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aura Márquez | Catálogo</title>
    <meta name="description" content="Catálogo y tienda de detalles personalizados de Aura Márquez.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Manrope', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#2c2420',
                            primary: '#b78c72',
                            accent: '#d1a384',
                            error: '#e63946'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* --- Animated Mesh Gradient Background --- */
        body {
            color: #2c2420;
            background-color: #fcf9f8;
        }
        
        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: 
                radial-gradient(at 0% 0%, rgba(245, 230, 222, 0.7) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(230, 215, 225, 0.7) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(220, 230, 240, 0.7) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(250, 240, 230, 0.7) 0px, transparent 50%);
            background-size: 200% 200%;
            animation: moveGradient 15s ease infinite alternate;
            opacity: 0.8;
        }
        
        @keyframes moveGradient {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 100%; }
        }

        /* --- Glassmorphism Utilities --- */
        .glass {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 32px 0 rgba(183, 140, 114, 0.08);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.6);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px 0 rgba(183, 140, 114, 0.15);
            border-color: rgba(255, 255, 255, 0.9);
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-left: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* --- Scrollbar --- */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(183, 140, 114, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(183, 140, 114, 0.6); }

        /* --- Dialog (Modal) --- */
        dialog {
            background: transparent;
            padding: 0;
            width: min(900px, 95vw);
            max-height: 90vh;
            border: none;
            overflow: visible; /* To allow close button to overhang */
        }
        dialog::backdrop {
            background: rgba(44, 36, 32, 0.4);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        @media (max-width: 768px) {
            dialog { margin: auto auto 0; width: 100%; max-width: 100%; border-radius: 24px 24px 0 0; }
            .modal-inner { border-radius: 24px 24px 0 0 !important; }
        }

        .modal-inner {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 90vh;
        }

        /* --- Skeletons --- */
        .sk {
            background: linear-gradient(90deg, rgba(255,255,255,0.2) 25%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0.2) 75%);
            background-size: 200% 100%;
            animation: sh 1.5s infinite;
        }
        @keyframes sh { to { background-position: -200% 0; } }

        /* --- Toasts --- */
        #toastContainer { transition: all 0.3s ease; }
        .toast-enter { transform: translateY(100%); opacity: 0; }
        .toast-enter-active { transform: translateY(0); opacity: 1; transition: all 300ms cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    </style>
</head>
<body class="relative min-h-screen pb-20 selection:bg-brand-primary selection:text-white">

    <!-- Background -->
    <div class="bg-mesh"></div>

    <!-- Header -->
    <header class="glass sticky top-0 z-30 shadow-sm border-b border-white/50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between gap-4">
            <a href="#" class="font-serif text-2xl md:text-3xl font-bold text-brand-dark tracking-tight flex-shrink-0" onclick="resetView(); return false;">
                Aura Márquez
            </a>
            
            <div class="flex-1 max-w-xl relative hidden md:block">
                <input id="q-desk" type="search" placeholder="Buscar detalles, aromas..." class="w-full bg-white/40 border border-white/70 rounded-full py-2.5 px-5 pl-11 focus:outline-none focus:ring-2 focus:ring-brand-primary/50 focus:bg-white/60 font-sans backdrop-blur-sm transition-all shadow-inner text-sm">
                <svg class="w-5 h-5 absolute left-4 top-3 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>

            <button onclick="toggleCart()" class="relative p-2.5 text-brand-dark hover:text-brand-primary transition-colors bg-white/40 border border-white/60 rounded-full shadow-sm hover:shadow-md backdrop-blur-sm flex-shrink-0">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                <span id="cartBadge" class="absolute -top-1 -right-1 bg-brand-error text-white text-[10px] font-bold h-5 w-5 flex items-center justify-center rounded-full shadow-sm border-2 border-[#fdfbfb] hidden transition-transform scale-0">0</span>
            </button>
        </div>
        <!-- Mobile Search -->
        <div class="px-4 pb-3 md:hidden relative block border-t border-white/20 pt-2 mt-1">
            <input id="q-mob" type="search" placeholder="Buscar detalles, aromas..." class="w-full bg-white/40 border border-white/70 rounded-full py-2 px-4 pl-10 focus:outline-none focus:ring-2 focus:ring-brand-primary/50 font-sans text-sm shadow-inner">
            <svg class="w-4 h-4 absolute left-7 top-3 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-12">
        <section class="mb-10 text-center">
            <h1 class="text-4xl md:text-5xl font-serif text-brand-dark mb-3 font-medium">Detalles únicos para ti</h1>
            <p class="text-gray-600 text-base md:text-lg max-w-2xl mx-auto font-sans">Elige tus productos favoritos, personalízalos y cotiza tu pedido al instante.</p>
        </section>

        <!-- Filters -->
        <div class="mb-6 space-y-3">
            <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar scroll-smooth" id="cats">
                <!-- Skeleton categories -->
                <div class="sk h-9 w-24 rounded-full"></div>
                <div class="sk h-9 w-20 rounded-full"></div>
                <div class="sk h-9 w-32 rounded-full"></div>
            </div>
            <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar scroll-smooth" id="tags"></div>
        </div>

        <!-- Product Grid -->
        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 md:gap-8 min-h-[50vh]">
            <!-- Skeletons -->
            <div class="sk rounded-2xl aspect-[4/5] glass-card"></div>
            <div class="sk rounded-2xl aspect-[4/5] glass-card"></div>
            <div class="sk rounded-2xl aspect-[4/5] glass-card"></div>
            <div class="sk rounded-2xl aspect-[4/5] glass-card"></div>
        </div>
    </main>

    <!-- Floating Action Button (Mobile Cart) -->
    <button onclick="toggleCart()" id="fabCart" class="fixed bottom-6 right-6 z-20 bg-brand-primary text-white p-4 rounded-full shadow-xl hover:shadow-2xl hover:scale-105 transition-all md:hidden hidden flex items-center justify-center border-2 border-white/50 backdrop-blur-sm">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        <span id="fabBadge" class="absolute top-0 right-0 bg-brand-error text-white text-xs font-bold h-5 w-5 flex items-center justify-center rounded-full border border-white transform translate-x-1/4 -translate-y-1/4">0</span>
    </button>

    <footer class="text-center text-gray-500/70 text-sm py-8 font-serif">
        © <span id="year"></span> Aura Márquez
    </footer>

    <!-- Product Modal -->
    <dialog id="dlg" class="relative">
        <div class="modal-inner flex flex-col md:flex-row relative">
            <button class="absolute top-4 right-4 md:right-6 w-9 h-9 bg-white/60 backdrop-blur-md border border-white/80 rounded-full shadow-sm flex items-center justify-center text-xl font-bold z-20 text-gray-700 hover:bg-white hover:text-brand-error transition-colors" onclick="dlg.close()" aria-label="Cerrar">×</button>
            
            <div class="w-full md:w-1/2 relative bg-white/20 flex flex-col" id="modal-img-container">
                <!-- Injected via JS -->
            </div>
            
            <div class="w-full md:w-1/2 p-6 md:p-8 flex flex-col overflow-y-auto custom-scrollbar" id="modal-info">
                <!-- Injected via JS -->
            </div>
        </div>
    </dialog>

    <!-- Cart Overlay -->
    <div id="cartOverlay" class="fixed inset-0 bg-brand-dark/20 backdrop-blur-sm z-40 opacity-0 pointer-events-none transition-opacity duration-300" onclick="toggleCart()"></div>

    <!-- Cart Sidebar (Offcanvas) -->
    <div id="cartSidebar" class="fixed top-0 right-0 h-full w-full sm:w-[420px] glass-panel transform translate-x-full transition-transform duration-300 ease-in-out z-50 flex flex-col shadow-2xl">
        
        <!-- Cart Header -->
        <div class="px-6 py-5 border-b border-white/40 flex justify-between items-center bg-white/30">
            <h2 class="text-2xl font-serif font-semibold text-brand-dark">Tu Pedido</h2>
            <button onclick="toggleCart()" class="text-gray-500 hover:text-brand-error transition-colors bg-white/50 rounded-full p-2 backdrop-blur-sm">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <!-- Cart Items -->
        <div id="cartItems" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 no-scrollbar">
            <!-- Injected via JS -->
        </div>

        <!-- Cart Footer -->
        <div class="p-6 border-t border-white/40 bg-white/50 backdrop-blur-md">
            <div class="flex justify-between items-end mb-6">
                <span class="text-gray-600 font-medium">Total estimado</span>
                <span id="cartTotal" class="text-2xl font-serif font-bold text-brand-dark">$0.00</span>
            </div>
            <button onclick="checkoutWhatsApp()" id="btnCheckout" class="w-full bg-[#25D366] hover:bg-[#128C7E] text-white font-semibold py-4 px-4 rounded-xl flex items-center justify-center space-x-2 transition-all shadow-lg hover:shadow-xl disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:shadow-lg transform active:scale-95">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                <span>Enviar pedido por WhatsApp</span>
            </button>
            <p class="text-[11px] text-center text-gray-500 mt-3 font-medium">Se abrirá WhatsApp para confirmar tu pedido.</p>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-[60] flex flex-col space-y-2 pointer-events-none w-full max-w-xs px-4"></div>

    <script>
        // ====== CONFIGURACIÓN ======
        const API_URL = 'https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQSJCGJ_d5_IIC8UmaM2pAk2apo5Iba0dLfp7SK9HnVltZdTcHZEsack-KHEbger8SKw14QNfA3zbt1mG3VWnhniG1Saj2WlJIPnvq9_4xDLQoR9iuwAtHvuboiW2pqitMsMsl-LaBVTxrZJVzgNDcea2ECQkT9YHYpgyofPgZ1H3GRzMQvqmW_KyCNESNy9lMH2392O6x1cvdAT6LawtGvIEghX5W01P4oTkqwCviB_AIXB9O7A6nSXx7ZMN8j-nmkHxETDUc6XMwbu-HlmHOrxA39oQ&lib=MpHRQXVBHio-7vMWajVVvnoBm0dSUUE7Q';
        const WHATSAPP = '529931732334';
        // ===========================

        const $ = id => document.getElementById(id);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const money = n => '$' + Number(n).toLocaleString('es-MX', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        const imgUrl = (id, w) => `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w}`;

        let D = {categorias: [], productos: []};
        let cat = '', tag = '', q = '';
        let sel = null, foto = 0, aroma = '', currentQty = 1;
        let cart = JSON.parse(localStorage.getItem('am_cart') || '[]');
        const dlg = $('dlg');

        document.getElementById('year').textContent = new Date().getFullYear();

        // ====== FETCH DATA ======
        async function cargar() {
            try { 
                const c = sessionStorage.getItem('am_cat'); 
                if (c) { D = JSON.parse(c); pintar(); } 
            } catch (e) {}

            try {
                const r = await fetch(API_URL); 
                D = await r.json();
                try { sessionStorage.setItem('am_cat', JSON.stringify(D)); } catch (e) {}
                pintar();
            } catch (e) {
                if (!D.productos.length) {
                    $('grid').innerHTML = `
                        <div class="col-span-full text-center py-20 text-gray-500 glass-card rounded-3xl mx-4">
                            <p class="mb-4 text-lg">No pudimos cargar el catálogo en este momento.</p>
                            <button class="px-6 py-2 bg-brand-primary text-white rounded-full hover:bg-brand-dark transition-colors shadow-md" onclick="cargar()">Reintentar</button>
                        </div>`;
                    $('cats').innerHTML = '';
                    $('tags').innerHTML = '';
                }
            }
            updateCartUI();
        }

        // ====== RENDER ======
        function pintar() {
            // Categorías
            const catArr = [['', 'Todos'], ['oferta', 'Ofertas'], ...D.categorias.map(c => [c.id, c.nombre])];
            $('cats').innerHTML = catArr.map(([k, t]) => `
                <button class="flex-none px-5 py-2 rounded-full font-medium text-sm transition-all border whitespace-nowrap 
                    ${cat === k ? 'bg-brand-primary text-white border-brand-primary shadow-md' : 'bg-white/60 text-gray-600 border-white/80 hover:bg-white/90 backdrop-blur-sm'}" 
                    data-c="${esc(k)}">${esc(t)}
                </button>`).join('');
            
            // Etiquetas
            const tags = [...new Set(D.productos.flatMap(p => p.etiquetas))].sort();
            $('tags').innerHTML = tags.map(t => `
                <button class="flex-none px-4 py-1.5 rounded-full font-medium text-xs transition-all border whitespace-nowrap
                    ${tag === t ? 'bg-brand-dark text-white border-brand-dark shadow' : 'bg-black/5 text-gray-600 border-black/10 hover:bg-black/10'}" 
                    data-t="${esc(t)}">${esc(t)}
                </button>`).join('');
            
            // Filtro Productos
            const ql = q.toLowerCase();
            const l = D.productos.filter(p =>
                (cat === '' || (cat === 'oferta' ? p.precioOferta : p.categoria === cat)) && 
                (!tag || p.etiquetas.includes(tag)) &&
                (!ql || (p.nombre + ' ' + p.descripcion + ' ' + (p.etiquetas||[]).join(' ') + ' ' + (p.aromas||[]).join(' ')).toLowerCase().includes(ql))
            ).sort((a, b) => b.destacado - a.destacado || a.nombre.localeCompare(b.nombre));
            
            // Pintar Grid
            $('grid').innerHTML = l.length ? l.map(p => {
                const isAgotado = p.disponibilidad === 'Agotado';
                const mainImg = p.imagenes && p.imagenes[0] ? imgUrl(p.imagenes[0], 500) : null;
                const priceHtml = p.precioOferta 
                    ? `<s class="text-xs text-gray-400 font-sans font-medium mr-1">${money(p.precio)}</s><span class="text-brand-error font-bold">${money(p.precioOferta)}</span>` 
                    : `<span class="text-brand-dark font-bold">${money(p.precio)}</span>`;

                return `
                <article class="glass-card rounded-[24px] overflow-hidden cursor-pointer group flex flex-col relative ${isAgotado ? 'opacity-80 grayscale-[30%]' : ''}" data-id="${esc(p.id)}">
                    
                    ${p.precioOferta && !isAgotado ? '<div class="absolute top-3 left-3 bg-brand-error text-white text-[10px] font-bold px-3 py-1 rounded-full shadow-sm z-10 tracking-wide uppercase">Oferta</div>' : ''}
                    ${isAgotado ? '<div class="absolute top-3 left-3 bg-gray-800 text-white text-[10px] font-bold px-3 py-1 rounded-full shadow-sm z-10 tracking-wide uppercase">Agotado</div>' : ''}
                    
                    <div class="aspect-square relative overflow-hidden bg-white/30 flex items-center justify-center p-4">
                        ${mainImg 
                            ? `<img loading="lazy" src="${mainImg}" alt="${esc(p.nombre)}" class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-700 ease-out drop-shadow-md">` 
                            : `<span class="font-serif text-5xl text-gray-300 opacity-50">${esc(p.nombre[0] || '')}</span>`}
                    </div>
                    
                    <div class="p-5 flex flex-col flex-1 border-t border-white/50 bg-white/40">
                        <h3 class="font-serif text-lg leading-tight mb-1 text-brand-dark group-hover:text-brand-primary transition-colors line-clamp-2">${esc(p.nombre)}</h3>
                        ${p.aromas && p.aromas.length ? `<small class="text-gray-500 text-xs block mb-3 font-medium">${p.aromas.length} aroma${p.aromas.length > 1 ? 's' : ''}</small>` : '<div class="h-5 mb-2"></div>'}
                        
                        <div class="mt-auto flex items-end justify-between">
                            <div class="font-serif text-xl">${priceHtml}</div>
                            <button class="w-9 h-9 rounded-full bg-white shadow-sm flex items-center justify-center text-brand-dark group-hover:bg-brand-primary group-hover:text-white transition-colors border border-white/80" aria-label="Ver detalle">
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
                            </button>
                        </div>
                    </div>
                </article>`;
            }).join('')
            : '<div class="col-span-full text-center py-16 text-gray-500 glass-card rounded-3xl mx-4">No encontramos detalles con estos filtros.</div>';
        }

        function resetView() {
            cat = ''; tag = ''; q = '';
            $('q-desk').value = '';
            $('q-mob').value = '';
            pintar();
        }

        // Event Listeners para Filtros
        $('cats').onclick = e => { const b = e.target.closest('[data-c]'); if (b) { cat = b.dataset.c; tag = ''; pintar(); } };
        $('tags').onclick = e => { const b = e.target.closest('[data-t]'); if (b) { tag = tag === b.dataset.t ? '' : b.dataset.t; pintar(); } };
        const searchHandler = e => { q = e.target.value; pintar(); };
        $('q-desk').oninput = searchHandler;
        $('q-mob').oninput = searchHandler;

        // Abrir Modal
        $('grid').onclick = e => { 
            const c = e.target.closest('article'); 
            if (c) abrir(c.dataset.id); 
        };

        function abrir(id) { 
            sel = D.productos.find(p => p.id === id); 
            aroma = ''; foto = 0; currentQty = 1; 
            ficha(); 
            dlg.showModal(); 
        }

        function updateModalQty(delta) {
            if (currentQty + delta > 0) { currentQty += delta; ficha(); }
        }

        function ficha() {
            const p = sel, ago = p.disponibilidad === 'Agotado';
            const reqAroma = p.aromas && p.aromas.length > 0;
            const canAdd = !ago && (!reqAroma || aroma);

            // Imágenes
            const imgHtml = p.imagenes && p.imagenes[foto] 
                ? `<img src="${imgUrl(p.imagenes[foto], 800)}" alt="${esc(p.nombre)}" class="absolute inset-0 w-full h-full object-contain p-6 md:p-10 drop-shadow-xl transition-opacity duration-300">` 
                : `<span class="absolute inset-0 flex items-center justify-center font-serif text-8xl text-brand-dark opacity-10">${esc(p.nombre[0] || '')}</span>`;

            const thumbsHtml = p.imagenes && p.imagenes.length > 1 ? `
                <div class="absolute bottom-4 left-0 w-full flex justify-center gap-2 px-4 z-10">
                    <div class="flex gap-2 p-2 bg-white/50 backdrop-blur-xl rounded-2xl shadow-sm border border-white/60 overflow-x-auto no-scrollbar max-w-full">
                        ${p.imagenes.map((m, i) => `<img class="w-14 h-14 md:w-16 md:h-16 object-cover rounded-xl border-2 cursor-pointer transition-all ${i === foto ? 'border-brand-primary scale-105 shadow-md' : 'border-transparent opacity-60 hover:opacity-100'}" data-f="${i}" src="${imgUrl(m, 120)}" alt="Foto">`).join('')}
                    </div>
                </div>` : '';

            $('modal-img-container').innerHTML = `
                <div class="aspect-square md:absolute md:inset-0 md:aspect-auto bg-gradient-to-br from-white/40 to-transparent">
                    ${imgHtml}
                    ${thumbsHtml}
                </div>
            `;

            // Info
            const priceHtml = p.precioOferta 
                ? `<s class="text-lg text-gray-400 font-sans font-medium mr-2">${money(p.precio)}</s><span class="text-brand-error font-bold">${money(p.precioOferta)}</span>` 
                : `<span class="text-brand-dark font-bold">${money(p.precio)}</span>`;

            $('modal-info').innerHTML = `
                <div class="mb-4">
                    <div class="flex items-center gap-2 mb-2">
                        ${p.precioOferta && !ago ? '<span class="bg-brand-error text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wide">Oferta</span>' : ''}
                        ${ago ? '<span class="bg-gray-800 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wide">Agotado</span>' : ''}
                    </div>
                    <h2 class="text-3xl md:text-4xl font-serif text-brand-dark mb-2 leading-tight">${esc(p.nombre)}</h2>
                    <div class="text-2xl font-serif flex items-baseline">
                        ${priceHtml}
                    </div>
                    ${p.ofertaHasta ? `<div class="text-brand-error text-xs font-semibold mt-1 bg-brand-error/10 inline-block px-2 py-1 rounded-md">Válido hasta el ${new Date(p.ofertaHasta + 'T00:00').toLocaleDateString('es-MX', {day: 'numeric', month: 'short'})}</div>` : ''}
                </div>
                
                ${p.descripcion ? `<div class="text-gray-600 mb-6 flex-1 text-sm md:text-base leading-relaxed"><p>${esc(p.descripcion).replace(/\n/g, '<br>')}</p></div>` : '<div class="flex-1"></div>'}
                
                <div class="mt-auto border-t border-brand-dark/10 pt-5 space-y-5">
                    ${reqAroma ? `
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-sm font-bold text-brand-dark uppercase tracking-wider">Elige tu aroma</span>
                            ${!aroma && !ago ? `<span class="text-brand-error text-xs font-bold animate-pulse bg-brand-error/10 px-2 py-0.5 rounded-full">Requerido</span>` : ''}
                        </div>
                        <div class="flex flex-wrap gap-2">
                            ${p.aromas.map(a => `<button class="px-4 py-2 rounded-xl text-sm font-medium border transition-all ${aroma === a ? 'bg-brand-primary text-white border-brand-primary shadow-md' : 'bg-white/60 border-white/80 text-gray-700 hover:border-brand-primary hover:bg-white'} ${ago ? 'opacity-50 cursor-not-allowed' : ''}" data-a="${esc(a)}" ${ago ? 'disabled' : ''}>${esc(a)}</button>`).join('')}
                        </div>
                    </div>` : ''}

                    <div class="flex flex-col sm:flex-row items-center gap-3">
                        <div class="flex items-center bg-white/60 rounded-xl border border-white/80 p-1 h-12 w-full sm:w-auto shadow-sm">
                            <button class="w-10 h-full flex items-center justify-center text-brand-dark hover:bg-white rounded-lg transition-colors font-bold text-xl" onclick="updateModalQty(-1)" ${ago ? 'disabled' : ''}>-</button>
                            <span class="w-12 text-center font-bold text-brand-dark">${currentQty}</span>
                            <button class="w-10 h-full flex items-center justify-center text-brand-dark hover:bg-white rounded-lg transition-colors font-bold text-xl" onclick="updateModalQty(1)" ${ago ? 'disabled' : ''}>+</button>
                        </div>
                        
                        <button id="btnAdd" class="h-12 w-full flex-1 rounded-xl font-bold flex items-center justify-center gap-2 transition-all shadow-md border ${canAdd ? 'bg-brand-dark text-white border-brand-dark hover:bg-brand-primary hover:border-brand-primary hover:shadow-lg' : 'bg-gray-100 text-gray-400 border-gray-200 cursor-not-allowed'}" onclick="addToCart()" ${!canAdd ? 'disabled' : ''}>
                            ${ago ? 'Agotado' : 'Agregar al carrito'}
                        </button>
                    </div>
                </div>
            `;
        }

        // Delegación de eventos modal
        $('dlg').onclick = e => {
            if (e.target === dlg) { dlg.close(); return; }
            const a = e.target.closest('[data-a]');
            const f = e.target.closest('[data-f]');
            if (a && sel.disponibilidad !== 'Agotado') { 
                aroma = aroma === a.dataset.a ? '' : a.dataset.a; 
                ficha(); 
            }
            if (f) { foto = +f.dataset.f; ficha(); }
        };

        // ====== CARRITO ======
        function addToCart() {
            if (sel.aromas && sel.aromas.length > 0 && !aroma) {
                showToast("Por favor selecciona un aroma.", "error");
                return;
            }
            if (sel.disponibilidad === 'Agotado') return;

            const price = sel.precioOferta || sel.precio;
            const cartId = `${sel.id}|${aroma}`;
            const existing = cart.find(i => i.cartId === cartId);

            if (existing) {
                existing.qty += currentQty;
            } else {
                cart.push({
                    cartId, 
                    id: sel.id, 
                    name: sel.nombre, 
                    price,
                    img: sel.imagenes && sel.imagenes[0] ? sel.imagenes[0] : '', 
                    aroma, 
                    qty: currentQty
                });
            }
            
            localStorage.setItem('am_cart', JSON.stringify(cart));
            updateCartUI();
            dlg.close();
            showToast('Agregado al carrito');
            
            setTimeout(() => { if ($('cartSidebar').classList.contains('translate-x-full')) toggleCart(); }, 400);
        }

        function updateCartQty(cartId, delta) {
            const idx = cart.findIndex(i => i.cartId === cartId);
            if (idx > -1) {
                cart[idx].qty += delta;
                if (cart[idx].qty <= 0) cart.splice(idx, 1);
                localStorage.setItem('am_cart', JSON.stringify(cart));
                updateCartUI();
            }
        }

        function removeCartItem(cartId) {
            cart = cart.filter(i => i.cartId !== cartId);
            localStorage.setItem('am_cart', JSON.stringify(cart));
            updateCartUI();
        }

        function updateCartUI() {
            const container = $('cartItems');
            const deskBadge = $('cartBadge');
            const mobBadge = $('fabBadge');
            const fabCart = $('fabCart');
            const totalEl = $('cartTotal');
            const btn = $('btnCheckout');
            
            let totalItems = 0;
            let totalPrice = 0;

            cart.forEach(item => {
                totalItems += item.qty;
                totalPrice += item.price * item.qty;
            });

            // Badges
            if (totalItems > 0) {
                deskBadge.textContent = totalItems;
                deskBadge.classList.remove('hidden');
                deskBadge.classList.add('scale-100');
                
                mobBadge.textContent = totalItems;
                fabCart.classList.remove('hidden');
            } else {
                deskBadge.classList.add('hidden', 'scale-0');
                fabCart.classList.add('hidden');
            }

            totalEl.textContent = money(totalPrice);
            btn.disabled = cart.length === 0;

            if (cart.length === 0) {
                container.innerHTML = `
                <div class="h-full flex flex-col items-center justify-center text-gray-400 opacity-70 pb-10">
                    <svg class="w-16 h-16 mb-4 text-brand-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                    <p class="font-medium text-lg font-serif">Tu pedido está vacío</p>
                    <button onclick="toggleCart()" class="mt-4 text-sm bg-white border border-gray-200 px-4 py-2 rounded-full hover:bg-gray-50">Explorar detalles</button>
                </div>`;
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="flex gap-4 p-3 bg-white/60 rounded-2xl border border-white/80 backdrop-blur-sm relative group shadow-sm">
                    <button onclick="removeCartItem('${item.cartId}')" class="absolute -top-2 -right-2 w-7 h-7 bg-white text-brand-error border border-gray-200 rounded-full flex items-center justify-center md:opacity-0 md:group-hover:opacity-100 transition-all shadow-md hover:bg-brand-error hover:text-white" aria-label="Eliminar">×</button>
                    
                    <div class="w-20 h-20 rounded-xl overflow-hidden flex-none bg-white p-1 shadow-inner">
                        ${item.img 
                            ? `<img src="${imgUrl(item.img, 150)}" class="w-full h-full object-cover rounded-lg">` 
                            : `<div class="w-full h-full flex items-center justify-center bg-gray-100 rounded-lg text-gray-400 font-serif text-xl">${esc(item.name[0])}</div>`}
                    </div>
                    
                    <div class="flex-1 flex flex-col py-0.5 justify-between">
                        <div>
                            <h4 class="font-serif text-brand-dark text-sm font-semibold leading-tight pr-4 line-clamp-2">${esc(item.name)}</h4>
                            ${item.aroma ? `<span class="text-[11px] font-medium text-brand-primary bg-brand-primary/10 px-2 py-0.5 rounded-md inline-block mt-1">Aroma: ${esc(item.aroma)}</span>` : ''}
                        </div>
                        
                        <div class="flex items-end justify-between mt-2">
                            <span class="font-bold text-brand-dark text-sm">${money(item.price)}</span>
                            <div class="flex items-center bg-white rounded-lg h-7 border border-gray-200 shadow-sm">
                                <button onclick="updateCartQty('${item.cartId}', -1)" class="w-7 h-full flex justify-center items-center hover:bg-gray-50 rounded-l-lg transition-colors text-gray-600">-</button>
                                <span class="w-7 text-center text-xs font-bold text-brand-dark">${item.qty}</span>
                                <button onclick="updateCartQty('${item.cartId}', 1)" class="w-7 h-full flex justify-center items-center hover:bg-gray-50 rounded-r-lg transition-colors text-gray-600">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleCart() {
            const sb = $('cartSidebar');
            const ov = $('cartOverlay');
            const isClosed = sb.classList.contains('translate-x-full');
            
            if (isClosed) {
                sb.classList.remove('translate-x-full');
                ov.classList.remove('opacity-0', 'pointer-events-none');
                ov.classList.add('opacity-100');
                document.body.style.overflow = 'hidden';
            } else {
                sb.classList.add('translate-x-full');
                ov.classList.remove('opacity-100');
                ov.classList.add('opacity-0', 'pointer-events-none');
                document.body.style.overflow = '';
            }
        }

        // ====== CHECKOUT ======
        function checkoutWhatsApp() {
            if (cart.length === 0) return;
            
            let msg = "Hola, me gustaría cotizar/pedir:\n\n";
            let total = 0;
            
            cart.forEach(i => {
                const subtotal = i.price * i.qty;
                total += subtotal;
                msg += `- ${i.qty}x ${i.name} ${i.aroma ? `(${i.aroma})` : ''} - ${money(subtotal)}\n`;
            });
            
            msg += `\nTotal: *${money(total)}*`;
            
            const encoded = encodeURIComponent(msg);
            window.open(`https://wa.me/${WHATSAPP}?text=${encoded}`, '_blank');
        }

        // ====== TOAST ======
        function showToast(message, type = "success") {
            const container = $('toastContainer');
            const toast = document.createElement('div');
            
            const bgClass = type === 'error' ? 'bg-brand-error' : 'bg-brand-dark';
            const icon = type === 'error' 
                ? `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />`
                : `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />`;

            toast.className = `${bgClass} text-white px-4 py-3 rounded-2xl shadow-xl text-sm font-medium flex items-center gap-3 toast-enter border border-white/20`;
            toast.innerHTML = `<svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">${icon}</svg> <span>${message}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-enter-active');
            });

            setTimeout(() => {
                toast.classList.remove('toast-enter-active');
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(100%)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Iniciar
        cargar();
    </script>
</body>
</html>
