<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lazul | Catálogo</title>
<meta name="description" content="Velas y ambientadores artesanales. Tu refugio en un momento.">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213D;--lapis:#2D4FD6;--soft:#E8EDFC;--mist:#F2F4F8;--line:#E3E7EF;--muted:#6B7690;--flame:#F5A524;--bad:#E5484D}
*{box-sizing:border-box;margin:0}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--mist);color:var(--ink);line-height:1.5}
h1,h2,h3,.brand{font-family:'Fraunces',Georgia,serif;font-weight:600}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--lapis);outline-offset:2px}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar{max-width:1150px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px}
.brand{font-size:1.6rem;color:var(--lapis)}
.bar input{flex:1;max-width:380px;margin-left:auto;border:1px solid var(--line);border-radius:99px;padding:10px 16px;font:inherit;background:var(--mist)}
.wrap{max-width:1150px;margin:0 auto;padding:20px 16px 60px}
.hero{padding:22px 0 8px}.hero h1{font-size:clamp(1.8rem,5vw,2.8rem)}.hero p{color:var(--muted)}
.pills{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.pill{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font-weight:600;font-size:.88rem;color:var(--ink)}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tags .pill{font-size:.8rem;padding:5px 12px;background:var(--soft);border-color:var(--soft);color:var(--lapis)}
.tags .pill.on{background:var(--lapis);color:#fff;border-color:var(--lapis)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin-top:14px}
.card{background:#fff;border-radius:20px;overflow:hidden;border:1px solid var(--line);cursor:pointer;text-align:left;padding:0;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(20,33,61,.12)}
.ph{aspect-ratio:1;background:linear-gradient(135deg,var(--soft),#fff);position:relative;display:grid;place-items:center;font:600 3rem 'Fraunces',serif;color:var(--lapis)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:10px;left:10px;background:var(--flame);color:#3b2600;font-weight:800;font-size:.72rem;padding:4px 10px;border-radius:99px;z-index:1}
.badge.ago{background:var(--ink);color:#fff}
.info{padding:14px 16px 16px}.info h3{font-size:1.1rem}.info small{color:var(--muted)}
.precio{margin-top:6px;font:600 1.2rem 'Fraunces',serif}.precio s{font:500 .85rem 'Manrope';color:var(--muted);margin-right:6px}.precio .of{color:var(--bad)}
.vacio,.err{text-align:center;color:var(--muted);padding:60px 16px}
.sk{aspect-ratio:.8;border-radius:20px;background:linear-gradient(90deg,#e8ebf2 25%,#f3f5f9 50%,#e8ebf2 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
dialog{border:0;border-radius:24px;padding:0;width:min(780px,94vw);max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(20,33,61,.35)}
dialog::backdrop{background:rgba(20,33,61,.55);backdrop-filter:blur(4px)}
.m{display:grid;grid-template-columns:1fr 1fr}
@media(max-width:700px){.m{grid-template-columns:1fr}dialog{margin:auto auto 0;width:100%;max-width:100%;border-radius:24px 24px 0 0}}
.gal .ph{aspect-ratio:1}.thumbs{display:flex;gap:6px;padding:8px}.thumbs img{width:54px;height:54px;object-fit:cover;border-radius:10px;border:2px solid transparent;cursor:pointer}.thumbs img.on{border-color:var(--lapis)}
.det{padding:22px;display:flex;flex-direction:column;gap:12px}.det h2{font-size:1.6rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-weight:600;font-size:.85rem}.chip.on{background:var(--lapis);color:#fff;border-color:var(--lapis)}
.wa{background:#1FA855;color:#fff;border:0;border-radius:14px;padding:14px;font-weight:700;text-decoration:none;text-align:center;display:block}
.wa[aria-disabled=true]{opacity:.5;pointer-events:none}
.x{position:absolute;top:10px;right:10px;background:#fff;border:0;border-radius:50%;width:38px;height:38px;font-size:1.2rem;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.2)}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:30px 16px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="bar"><span class="brand">Lazul</span><input id="q" type="search" placeholder="Buscar velas, aromas…" aria-label="Buscar"></div></header>
<main class="wrap">
  <section class="hero"><h1>Tu refugio en un momento</h1><p>Velas y ambientadores hechos a mano. Elige el que más te guste y pídelo por WhatsApp.</p></section>
  <div class="pills" id="cats"></div>
  <div class="pills tags" id="tags"></div>
  <div class="grid" id="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
</main>
<footer>© Lazul</footer>

<dialog id="dlg"><div style="position:relative"><button class="x" onclick="dlg.close()" aria-label="Cerrar">×</button><div class="m" id="modal"></div></div></dialog>

<script>
// ====== CONFIGURA ESTO ======
const API_URL = 'https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQSJCGJ_d5_IIC8UmaM2pAk2apo5Iba0dLfp7SK9HnVltZdTcHZEsack-KHEbger8SKw14QNfA3zbt1mG3VWnhniG1Saj2WlJIPnvq9_4xDLQoR9iuwAtHvuboiW2pqitMsMsl-LaBVTxrZJVzgNDcea2ECQkT9YHYpgyofPgZ1H3GRzMQvqmW_KyCNESNy9lMH2392O6x1cvdAT6LawtGvIEghX5W01P4oTkqwCviB_AIXB9O7A6nSXx7ZMN8j-nmkHxETDUc6XMwbu-HlmHOrxA39oQ&lib=MpHRQXVBHio-7vMWajVVvnoBm0dSUUE7Q';
const WHATSAPP = '529931732334'; // código de país + número, sin + ni espacios
// ============================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Number(n).toLocaleString('es-MX');
const img = (id, w) => `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w}`;
const dlg = $('dlg');
let D = {categorias: [], productos: []}, cat = '', tag = '', q = '', aroma = '', sel = null, foto = 0;

async function cargar() {
  try { const c = sessionStorage.getItem('lz_cat'); if (c) { D = JSON.parse(c); pintar(); } } catch (e) {}
  try {
    const r = await fetch(API_URL); D = await r.json();
    try { sessionStorage.setItem('lz_cat', JSON.stringify(D)); } catch (e) {}
    pintar();
  } catch (e) {
    if (!D.productos.length) $('grid').innerHTML = '<div class="err" style="grid-column:1/-1">No pudimos cargar el catálogo. <br><button class="pill" onclick="cargar()">Reintentar</button></div>';
  }
}

function pintar() {
  $('cats').innerHTML = [['', 'Todo'], ['oferta', 'Ofertas'], ...D.categorias.map(c => [c.id, c.nombre])]
    .map(([k, t]) => `<button class="pill ${cat === k ? 'on' : ''}" data-c="${esc(k)}">${esc(t)}</button>`).join('');
  const tags = [...new Set(D.productos.flatMap(p => p.etiquetas))].sort();
  $('tags').innerHTML = tags.map(t => `<button class="pill ${tag === t ? 'on' : ''}" data-t="${esc(t)}">${esc(t)}</button>`).join('');
  const ql = q.toLowerCase();
  const l = D.productos.filter(p =>
    (cat === '' || (cat === 'oferta' ? p.precioOferta : p.categoria === cat)) && (!tag || p.etiquetas.includes(tag)) &&
    (!ql || (p.nombre + ' ' + p.descripcion + ' ' + p.etiquetas.join(' ') + ' ' + p.aromas.join(' ')).toLowerCase().includes(ql)))
    .sort((a, b) => b.destacado - a.destacado || a.nombre.localeCompare(b.nombre));
  $('grid').innerHTML = l.length ? l.map(p => `<button class="card" data-id="${esc(p.id)}">
    <div class="ph">${p.imagenes[0] ? `<img loading="lazy" src="${img(p.imagenes[0], 500)}" alt="${esc(p.nombre)}">` : esc(p.nombre[0] || '')}
      ${p.disponibilidad === 'Agotado' ? '<span class="badge ago">Agotado</span>' : p.precioOferta ? '<span class="badge">Oferta</span>' : ''}</div>
    <div class="info"><h3>${esc(p.nombre)}</h3>${p.aromas.length ? `<small>${p.aromas.length} aroma${p.aromas.length > 1 ? 's' : ''}</small>` : ''}
      <div class="precio">${p.precioOferta ? `<s>${money(p.precio)}</s><span class="of">${money(p.precioOferta)}</span>` : money(p.precio)}</div></div></button>`).join('')
    : '<div class="vacio" style="grid-column:1/-1">No encontramos productos con esos filtros.</div>';
}

$('cats').onclick = e => { const b = e.target.closest('[data-c]'); if (b) { cat = b.dataset.c; pintar(); } };
$('tags').onclick = e => { const b = e.target.closest('[data-t]'); if (b) { tag = tag === b.dataset.t ? '' : b.dataset.t; pintar(); } };
$('q').oninput = e => { q = e.target.value; pintar(); };
$('grid').onclick = e => { const c = e.target.closest('.card'); if (c) abrir(c.dataset.id); };

function abrir(id) { sel = D.productos.find(p => p.id === id); aroma = ''; foto = 0; ficha(); dlg.showModal(); }
function ficha() {
  const p = sel, ago = p.disponibilidad === 'Agotado';
  const msg = `Hola, me interesa: ${p.nombre}${aroma ? ' (aroma ' + aroma + ')' : ''}`;
  $('modal').innerHTML = `<div class="gal"><div class="ph">${p.imagenes[foto] ? `<img src="${img(p.imagenes[foto], 800)}" alt="${esc(p.nombre)}">` : esc(p.nombre[0] || '')}</div>
    ${p.imagenes.length > 1 ? `<div class="thumbs">${p.imagenes.map((m, i) => `<img class="${i === foto ? 'on' : ''}" data-f="${i}" src="${img(m, 120)}" alt="Foto ${i + 1}">`).join('')}</div>` : ''}</div>
    <div class="det"><h2>${esc(p.nombre)}</h2>
      <div class="precio" style="font-size:1.5rem">${p.precioOferta ? `<s>${money(p.precio)}</s><span class="of">${money(p.precioOferta)}</span>` : money(p.precio)}</div>
      ${p.ofertaHasta ? `<small style="color:var(--bad);font-weight:700">Oferta válida hasta el ${new Date(p.ofertaHasta + 'T00:00').toLocaleDateString('es-MX', {day: 'numeric', month: 'long'})}</small>` : ''}
      ${p.disponibilidad !== 'Disponible' ? `<small style="font-weight:700">${esc(p.disponibilidad)}</small>` : ''}
      ${p.descripcion ? `<p>${esc(p.descripcion)}</p>` : ''}
      ${p.aromas.length ? `<div><small style="color:var(--muted);font-weight:600">Elige tu aroma</small><div class="chips" style="margin-top:6px">${p.aromas.map(a => `<button class="chip ${aroma === a ? 'on' : ''}" data-a="${esc(a)}">${esc(a)}</button>`).join('')}</div></div>` : ''}
      <a class="wa" ${ago ? 'aria-disabled="true"' : ''} target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}">${ago ? 'Agotado por ahora' : 'Pedir por WhatsApp'}</a></div>`;
}
$('modal').onclick = e => {
  const a = e.target.closest('[data-a]'), f = e.target.closest('[data-f]');
  if (a) { aroma = aroma === a.dataset.a ? '' : a.dataset.a; ficha(); }
  if (f) { foto = +f.dataset.f; ficha(); }
};
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
cargar();
</script>
</body>
</html>
